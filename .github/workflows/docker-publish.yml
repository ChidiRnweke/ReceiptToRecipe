name: Publish production image

# Called by the release workflow rather than triggered by the tag it pushes.
# release-please tags with the default GITHUB_TOKEN, and GitHub does not start a
# workflow run from an event created with that token, so `on: push: tags` would
# never fire for a release-please tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  # The way to deploy a release that already exists, or to re-deploy without
  # cutting a version.
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: 'Release tag to build and deploy, e.g. v0.1.0'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # The tag, not the branch: by the time this job starts, master may already
      # carry commits that are not part of the release being shipped.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `type=ref,event=tag` reads the ref of the triggering event, and this
          # workflow is not triggered by one. The input is the tag.
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Komodo deployment
        env:
          KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL }}
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          signature="$(printf '{}' | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" -hex | sed 's/^.* //')"
          curl --fail-with-body --request POST \
            --header 'Content-Type: application/json' \
            --header "X-Hub-Signature-256: sha256=$signature" \
            --data '{}' \
            "$KOMODO_WEBHOOK_URL"
